<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password - RCT</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background: #f4f6f9;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}


.password-box {

    width: 380px;
    background: white;
    padding: 35px;
    border-radius: 12px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.15);

}


.logo {

    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#1f4e79;
}


.subtitle {

    text-align:center;
    color:#777;
    margin-bottom:30px;

}


label {

    font-size:14px;
    font-weight:bold;

}


input {

    width:100%;
    padding:12px;

    margin-top:8px;
    margin-bottom:20px;

    border:1px solid #ccc;
    border-radius:8px;

    box-sizing:border-box;

}


button {

    width:100%;
    padding:12px;

    background:#1f4e79;
    color:white;

    border:none;
    border-radius:8px;

    font-size:16px;
    cursor:pointer;

}


button:hover {

    opacity:.9;

}


.back {

    display:block;
    text-align:center;

    margin-top:20px;

    text-decoration:none;
    color:#1f4e79;

}


</style>

</head>


<body>


<div class="password-box">


<div class="logo">
RCT
</div>


<div class="subtitle">
Change Password
</div>



<form method="POST">


<label>
Current Password
</label>

<input 
type="password"
name="old_password"
required>



<label>
New Password
</label>

<input
type="password"
name="new_password"
required>



<label>
Confirm New Password
</label>

<input
type="password"
name="confirm_password"
required>



<button type="submit">
Update Password
</button>


</form>



<a class="back" href="{{ url_for('dashboard') }}">
Back to Dashboard
</a>



</div>


</body>
</html>
